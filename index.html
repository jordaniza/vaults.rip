    <style>
      :root {
        color-scheme: dark;
        --background: #080d13;
        --surface: #0d141d;
        --border: #202a35;
        --text-primary: #e9edf2;
        --text-secondary: #a6afba;
        --text-muted: #747e89;
        --accent: #5ea7ff;
        --font-editorial: "Newsreader", Georgia, serif;
        --font-body: "Source Sans 3", Arial, sans-serif;
        --font-mono: "IBM Plex Mono", monospace;
        --page-width: 1240px;
        --prose-width: 780px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: var(--background);
        color: var(--text-primary);
        font-family: var(--font-body);
        font-size: 19px;
        line-height: 1.68;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      a {
        color: var(--accent);
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
      }

      a:hover {
        text-decoration: underline;
      }

      a:focus-visible {
        border-radius: 2px;
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }

      .skip-link {
        position: fixed;
        z-index: 10;
        top: 12px;
        left: 12px;
        padding: 8px 12px;
        background: var(--text-primary);
        color: var(--background);
        font-size: 16px;
        transform: translateY(-160%);
      }

      .skip-link:focus {
        transform: translateY(0);
      }

      .page-shell {
        width: min(calc(100% - 96px), var(--page-width));
        margin-inline: auto;
      }

      .prose {
        max-width: var(--prose-width);
      }

      .site-header {
        border-bottom: 1px solid var(--border);
      }

      .header-inner {
        display: flex;
        min-height: 96px;
        align-items: center;
        justify-content: space-between;
        gap: 40px;
      }

      .wordmark {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 12px;
        color: var(--text-primary);
        font-family: var(--font-editorial);
        font-size: 30px;
        font-weight: 500;
        letter-spacing: -0.025em;
        line-height: 1;
        text-decoration: none;
      }

      .wordmark:hover {
        text-decoration: none;
      }

      .brand-icon {
        width: 36px;
        height: 36px;
        object-fit: contain;
      }

      .site-nav ul {
        display: flex;
        align-items: center;
        margin: 0;
        padding: 0;
        gap: 32px;
        list-style: none;
      }

      .site-nav a,
      .nav-pending {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        color: var(--text-secondary);
        font-size: 16px;
        line-height: 1.3;
        text-decoration: none;
        white-space: nowrap;
      }

      .site-nav a:hover,
      .site-nav a[aria-current="page"] {
        color: var(--accent);
      }

      .nav-pending {
        color: var(--text-muted);
      }

      main {
        padding-block: 104px 120px;
      }

      section + section {
        margin-top: 96px;
      }

      h1,
      h2 {
        margin: 0;
        font-family: var(--font-editorial);
        font-weight: 500;
      }

      h1 {
        font-size: clamp(46px, 6vw, 68px);
        letter-spacing: -0.035em;
        line-height: 1.05;
      }

      h2 {
        font-size: 34px;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      h3 {
        margin: 36px 0 0;
        color: var(--text-primary);
        font-family: var(--font-body);
        font-size: 19px;
        font-weight: 600;
        line-height: 1.4;
      }

      p {
        margin: 0;
        color: var(--text-secondary);
      }

      p + p {
        margin-top: 20px;
      }

      .prose p + p {
        margin-top: 32px;
      }

      h1 + p,
      h2 + p,
      h3 + p {
        margin-top: 24px;
      }

      h2 + h3 {
        margin-top: 28px;
      }

      .case-heading {
        margin-bottom: 28px;
      }

      .table-wrap {
        width: 100%;
        overflow-x: auto;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
      }

      table {
        width: 100%;
        min-width: 680px;
        border-collapse: collapse;
        text-align: left;
      }

      th,
      td {
        padding: 18px 20px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }

      th:first-child,
      td:first-child {
        padding-left: 0;
      }

      th:last-child,
      td:last-child {
        padding-right: 0;
      }

      th {
        color: var(--text-secondary);
        font-size: 15px;
        font-weight: 500;
      }

      td {
        color: var(--text-primary);
        font-size: 17px;
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      .empty-state {
        padding-block: 32px;
        color: var(--text-muted);
      }

      .site-footer {
        border-top: 1px solid var(--border);
      }

      .footer-inner {
        display: flex;
        min-height: 96px;
        align-items: center;
        justify-content: space-between;
        gap: 32px;
        color: var(--text-muted);
        font-size: 15px;
      }

      .footer-inner a {
        color: var(--text-muted);
        text-decoration: none;
      }

      .footer-inner a:hover {
        color: var(--accent);
      }

      @media (max-width: 720px) {
        .page-shell {
          width: calc(100% - 48px);
        }

        .header-inner {
          min-height: auto;
          align-items: flex-start;
          flex-direction: column;
          gap: 18px;
          padding-block: 24px 18px;
        }

        .site-nav,
        .site-nav ul {
          width: 100%;
        }

        .site-nav ul {
          flex-wrap: wrap;
          gap: 8px 24px;
        }

        main {
          padding-block: 72px 88px;
        }

        section + section {
          margin-top: 72px;
        }

        h1 {
          font-size: 48px;
        }

        h2 {
          font-size: 30px;
        }

        table {
          min-width: 0;
          table-layout: fixed;
        }

        th,
        td {
          padding-inline: 8px;
        }

        th {
          font-size: 13px;
        }

        .footer-inner {
          min-height: auto;
          align-items: flex-start;
          flex-direction: column;
          gap: 4px;
          padding-block: 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
      }
    </style>
