name: Check links

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and check internal links
        run: pnpm verify

      - name: Check outbound links
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: >-
            --no-progress
            --root-dir "$GITHUB_WORKSPACE/dist"
            --max-retries 3
            --retry-wait-time 2
            --timeout 30
            --accept "100..=103,200..=399,429"
            README.md
            AGENTS.md
            CONTRIBUTING.md
            "content/**/*.md"
            "dist/**/*.html"
            "dist/**/*.md"
            "dist/**/*.txt"
          fail: true
          failIfEmpty: true
